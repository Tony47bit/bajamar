
name: Android CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Inspeccionar archivos
        run: |
          echo "=== RAIZ DEL REPOSITORIO ==="
          pwd
          ls -la

          echo "=== ARCHIVOS GRADLE ==="
          find . -maxdepth 5 \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -type f -print
