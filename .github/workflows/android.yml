
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bajamar

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: bajamar/gradle/wrapper/gradle-wrapper.properties

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: bajamar-debug-apk
          path: bajamar/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
